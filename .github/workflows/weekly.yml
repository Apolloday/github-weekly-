name: GitHub Weekly Top 8

on:
  schedule:
    # UTC Thursday 12:00 = Asia/Shanghai Thursday 20:00.
    - cron: '0 12 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Replace only today cloud report (AI may be billed again)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: github-weekly-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate weekly report
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE_AI: ${{ vars.ENABLE_AI || 'false' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          REPORT_FORCE: ${{ inputs.force || false }}
        run: python scripts/update_github.py

      - name: Commit report if changed
        shell: bash
        run: |
          git add -- github.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update GitHub weekly top 8"
          git push
